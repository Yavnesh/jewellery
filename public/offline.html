<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Vamika Jewels</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fdfcf7;
      color: #3b2c1f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 24px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      color: #6e5e50;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #3b2c1f;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #55412f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You are Offline</h1>
    <p>It seems you are not connected to the internet. Please check your network settings and try reloading the page.</p>
    <a href="/" class="btn" onclick="window.location.reload(true); return false;">Try Again</a>
  </div>
</body>
</html>
